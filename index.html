<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Falcnode</title>
  <meta name="description" content="Falcnode – hamarosan.">
  <link rel="canonical" href="https://falcnode.com/">
  <meta name="theme-color" content="#06110e">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta property="og:title" content="Falcnode">
  <meta property="og:url" content="https://falcnode.com/">
  <meta property="og:image" content="https://falcnode.com/banner.jpg">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html{background:#04080b}
    html,body{min-height:100%}
    body{
      min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;
      gap:clamp(1.5rem,4vw,2.75rem);padding:clamp(1rem,3vw,2.5rem);
      background:radial-gradient(ellipse at 50% 35%,#0f2a22 0%,#08160f 45%,#04080b 100%);
      color:#d7e9e1;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
      -webkit-font-smoothing:antialiased;
    }
    .banner{width:min(100%,1280px,calc((100vh - 10rem) * 1.7927));min-width:min(100%,320px);border-radius:clamp(8px,1.2vw,16px);overflow:hidden;
      box-shadow:0 0 0 1px rgba(80,220,150,.12),0 30px 80px -20px rgba(0,0,0,.8),0 0 120px -30px rgba(60,220,140,.25)}
    .banner img{display:block;width:100%;height:auto;aspect-ratio:1920/1071}
    .mail{max-width:100%;overflow-wrap:anywhere;display:inline-flex;align-items:center;gap:.6em;padding:.85em 1.5em;border-radius:999px;
      font-size:clamp(1rem,1.2vw + .6rem,1.2rem);font-weight:500;letter-spacing:.01em;
      color:#e9fff4;text-decoration:none;background:rgba(40,200,120,.08);
      border:1px solid rgba(80,230,150,.35);transition:background .2s,border-color .2s,box-shadow .2s}
    .mail:hover{background:rgba(40,200,120,.16);border-color:rgba(110,240,170,.7);box-shadow:0 0 30px -6px rgba(70,230,150,.45)}
    .mail:focus-visible{outline:2px solid #6ff0aa;outline-offset:3px}
    .mail svg{width:1.15em;height:1.15em;flex:none;color:#5ee69c}
    h1{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  </style>
</head>
<body>
  <h1>Falcnode</h1>
  <div class="banner">
    <picture>
      <source type="image/webp" srcset="/banner-960.webp 960w, /banner.webp 1920w" sizes="(max-width:1280px) 100vw, 1280px">
      <img src="/banner.jpg" width="1920" height="1071" alt="Falcnode – falcnode.com • falcnode.hu">
    </picture>
  </div>
  <a class="mail" href="mailto:tamas.szabo@falcnode.com">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
    tamas.szabo@falcnode.com
  </a>
</body>
</html>
